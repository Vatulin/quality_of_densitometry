<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DXA Batch Processor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .drag-active { border-color: #3b82f6; background-color: #eff6ff; }
        .path-cell { cursor: pointer; }
        .path-cell:hover { background-color: #f3f4f6; }
        .modal { display: none; }
        .modal.active { display: flex; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-8 font-sans text-gray-800">

    <div class="max-w-6xl mx-auto">

        <div id="drop-zone" class="border-2 border-dashed border-gray-300 rounded-xl p-10 text-center bg-white transition-all cursor-pointer hover:border-blue-400">
            <input type="file" id="file-input" class="hidden" accept=".zip">
            <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <p class="mt-4 text-lg font-medium text-gray-700">Перетащите ZIP-архив сюда или <span class="text-blue-600">выберите файл</span></p>
        </div>

        <div id="progress-section" class="hidden mt-8 bg-white p-6 rounded-xl shadow-sm">
            <div class="flex justify-between mb-2">
                <span id="status-text" class="font-semibold text-gray-700">Обработка...</span>
                <span id="progress-text" class="text-gray-500">0 / 0</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-2.5">
                <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>

        <!-- Результаты -->
        <div id="results-section" class="hidden mt-8">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold">Результаты обработки</h2>
                <button id="download-btn" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Скачать CSV
                </button>
            </div>
            
            <div class="bg-white rounded-xl shadow-sm overflow-hidden">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Файл</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Путь в архиве</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Предсказание</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Уверенность</th>
                        </tr>
                    </thead>
                    <tbody id="results-table-body" class="bg-white divide-y divide-gray-200 text-sm">
                        <!-- Сюда JS вставит строки -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="path-modal" class="modal fixed inset-0 bg-black bg-opacity-50 items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full mx-4">
            <div class="flex justify-between items-center p-4 border-b">
                <h3 class="text-lg font-semibold text-gray-900">Полный путь к файлу</h3>
                <button id="close-modal" class="text-gray-400 hover:text-gray-600 transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <div class="p-6">
                <div class="bg-gray-50 rounded-lg p-4">
                    <p id="modal-path-text" class="text-sm font-mono text-gray-800 break-all select-all"></p>
                </div>
                <p class="text-xs text-gray-500 mt-2">💡 Текст выделен — нажмите Ctrl+C для копирования</p>
            </div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const pathModal = document.getElementById('path-modal');
        const modalPathText = document.getElementById('modal-path-text');
        const closeModalBtn = document.getElementById('close-modal');
        let currentTaskId = null;
        let pollInterval = null;

        // Drag & Drop логика
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-active'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-active'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-active');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });

        // Модальное окно
        closeModalBtn.addEventListener('click', () => {
            pathModal.classList.remove('active');
        });

        pathModal.addEventListener('click', (e) => {
            if (e.target === pathModal) {
                pathModal.classList.remove('active');
            }
        });

        function showPathModal(path) {
            modalPathText.textContent = path;
            pathModal.classList.add('active');
        }

        async function handleFile(file) {
            if (!file.name.endsWith('.zip')) {
                alert('Пожалуйста, выберите ZIP-архив');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            // Показываем прогресс
            document.getElementById('progress-section').classList.remove('hidden');
            document.getElementById('results-section').classList.add('hidden');
            updateProgress(0, 1, 'Загрузка файла...');

            try {
                const response = await fetch('/api/upload', { method: 'POST', body: formData });
                const data = await response.json();
                
                if (data.error) {
                    alert(data.error);
                    return;
                }

                currentTaskId = data.task_id;
                startPolling();
            } catch (err) {
                alert('Ошибка загрузки: ' + err.message);
            }
        }

        function startPolling() {
            if (pollInterval) clearInterval(pollInterval);
            
            pollInterval = setInterval(async () => {
                try {
                    const response = await fetch(`/api/status/${currentTaskId}`);
                    const data = await response.json();

                    if (data.status === 'PROCESSING') {
                        updateProgress(data.progress, data.total, 'Обработка изображений...');
                    } else if (data.status === 'COMPLETED') {
                        clearInterval(pollInterval);
                        updateProgress(data.total, data.total, 'Готово!');
                        showResults(data.results);
                    } else if (data.status === 'FAILED') {
                        clearInterval(pollInterval);
                        alert('Ошибка обработки: ' + data.error);
                    }
                } catch (err) {
                    console.error(err);
                }
            }, 1000);
        }

        function updateProgress(current, total, text) {
            document.getElementById('status-text').innerText = text;
            document.getElementById('progress-text').innerText = `${current} / ${total}`;
            const percent = total > 0 ? (current / total) * 100 : 0;
            document.getElementById('progress-bar').style.width = `${percent}%`;
        }

        function showResults(results) {
            document.getElementById('results-section').classList.remove('hidden');
            const tbody = document.getElementById('results-table-body');
            tbody.innerHTML = '';

            results.forEach(row => {
                const tr = document.createElement('tr');
                
                tr.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap font-medium text-gray-900">${row.filename}</td>
                    <td class="px-6 py-4 text-sm text-gray-600 font-mono max-w-xs truncate path-cell" onclick="showPathModal('${row.path.replace(/'/g, "\\'")}')">${row.path}</td>
                    <td class="px-6 py-4 whitespace-nowrap font-bold text-gray-800">${row.prediction}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-gray-600">${row.confidence}</td>
                `;
                tbody.appendChild(tr);
            });

            // Настраиваем кнопку скачивания
            document.getElementById('download-btn').onclick = () => {
                window.location.href = `/api/download/${currentTaskId}`;
            };
        }
    </script>
</body>
</html>
